<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineBuild</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/minecraft-3');
    body { margin: 0; padding: 0; background: #ffffff; color: #000000; font-family: 'Minecraft', monospace; font-smooth: never; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; text-align: center; }
    header { margin-bottom: 30px; }
    .logo { width: 280px; height: auto; display: block; margin: 0 auto 15px; animation: spin 8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    h1 { font-size: 52px; margin: 10px 0; }
    .intro { font-size: 18px; max-width: 800px; margin: 20px auto; color: #333; opacity: 0; transform: translateY(20px); animation: fadeInUp 1.5s forwards; }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .btn { background: #000; color: #fff; padding: 12px 24px; border: none; font-size: 18px; cursor: pointer; margin: 10px; font-family: 'Minecraft', monospace; transition: transform 0.2s; }
    .btn:hover { background: #333; transform: scale(1.05); }
    form { background: #f0f0f0; padding: 25px; border-radius: 10px; max-width: 500px; margin: 20px auto; text-align: left; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; }
    .result { background: #fff; padding: 20px; border: 3px solid #000; margin: 30px auto; max-width: 800px; text-align: left; border-radius: 10px; opacity: 0; transform: translateY(30px); transition: all 0.6s; }
    .result.show { opacity: 1; transform: translateY(0); }
    .materials-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
    .material-item { border: 2px solid #000; padding: 10px; text-align: center; transform: scale(0.8); transition: transform 0.5s; }
    .material-item.show { transform: scale(1); }
    .material-item img { width: 64px; height: 64px; }
    .step { margin: 15px 0; padding: 10px; background: #f8f8f8; border-left: 5px solid #000; opacity: 0; transform: translateX(-30px); transition: all 0.6s; }
    .step.show { opacity: 1; transform: translateX(0); }
    .model-info { font-size: 14px; color: #666; margin-top: 10px; }
    .madeby { position: fixed; bottom: 20px; right: 20px; font-size: 14px; color: #000; text-decoration: none; font-family: 'Minecraft', monospace; }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border: 5px solid #000; padding: 30px; width: 500px; text-align: center; z-index: 100; animation: modalPop 0.4s forwards; }
    @keyframes modalPop { from { transform: translate(-50%, -80%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
    .modal.show { display: block; }
    .loading { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="https://raw.githubusercontent.com/illusd-com/frwt/refs/heads/main/MINE%20BUILD_20260812_175629_0000.png" alt="MineBuild Logo" class="logo">
      <h1>MineBuild</h1>
      <p class="intro">
        MINE BUILD 是 AI 驅動的 Minecraft 基岩版建造材料準備助理。<br>
        完全開源、MIT 授權，幫助你快速規劃機器與建築，優化材料使用到極致。
      </p>
    </header>

    <button class="btn" onclick="document.getElementById('form-section').scrollIntoView({ behavior: 'smooth' })">BuildNow</button>

    <div id="form-section">
      <form id="build-form">
        <label>你想製作的機器或建築等：<input type="text" id="purpose" placeholder="例如：終界風暴建築" required></label>
        <label>建造的模式：
          <select id="mode">
            <option value="創造">創造</option>
            <option value="生存">生存</option>
            <option value="生存(極限)">生存(極限)</option>
          </select>
        </label>
        <label>世界種子碼（非必填）：<input type="text" id="seed"></label>
        <label>分析模式：
          <select id="analysis">
            <option value="SuperMini">SuperMini</option>
            <option value="QuickBuild">QuickBuild</option>
            <option value="LimiCons">LimiCons</option>
          </select>
        </label>
        <button type="button" class="btn" onclick="analyzeBuild()">分析</button>
      </form>
    </div>

    <div id="result" class="result">
      <h2>AI 分析結果</h2>
      <div id="model-info"></div>
      <div id="ai-result"></div>
      <div id="materials-list" class="materials-grid"></div>
      <div id="steps-list"></div>
    </div>
  </div>

  <a href="https://github.com/illusd" class="madeby" target="_blank">MadeByIllusdOrg</a>

  <div id="star-modal" class="modal">
    <h2>為我們 Github 專案給個 Star 吧！謝謝你☺️</h2>
    <button class="btn" onclick="openGithub()">前往Github專案</button>
    <button class="btn" onclick="closeModal()">真的嗎  拜託麻</button>
    <button class="btn" onclick="closeModal()">好！</button>
  </div>

  <script>
    function analyzeBuild() {
      const purpose = document.getElementById('purpose').value;
      const mode = document.getElementById('mode').value;
      const seed = document.getElementById('seed').value;
      const analysis = document.getElementById('analysis').value;

      let apiUrl = "https://free.v36.cm/v1/chat/completions";
      const apiKey = "YOUR_API_KEY_HERE"; // 請在 Vercel 環境變數設定

      const promptMap = {
        "SuperMini": "用最少材料，快速分析",
        "QuickBuild": "快速分析，優化效率",
        "LimiCons": "分析到極致，運用更多材料更新到極致"
      };

      const prompt = `你是一名minecraft 基岩建造/機器規劃者
用途：${purpose}
下面是其他資料，請依照目前的模式（必要）或種子碼（非必要）生成資料
模式：${mode}
種子碼：${seed || '無'}
${promptMap[analysis] || '快速分析'}

請將您分析結果將機器/建築優化到極致，用最少材料`;

      fetch(apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [{ role: "user", content: prompt }]
        })
      })
      .then(r => r.json())
      .then(data => {
        const result = document.getElementById('result');
        result.classList.add('show');

        const usedModel = data.model || "gpt-4o-mini";
        document.getElementById('model-info').innerHTML = `<p><strong>已使用模型：</strong> ${usedModel} <span style="color:#666;">(免費版可用模型)</span></p>`;

        const aiResult = document.getElementById('ai-result');
        aiResult.innerHTML = '';
        let content = data.choices[0].message.content;
        let i = 0;

        const typing = setInterval(() => {
          if (i < content.length) {
            aiResult.innerHTML += content[i];
            aiResult.scrollTop = aiResult.scrollHeight;
            i++;
          } else {
            clearInterval(typing);
          }
        }, 40);

        // 材料動畫
        const materialsHTML = `<div class="material-item"><img src="https://zh.minecraft.wiki/images/thumb/Grass_Block.png/64px-Grass_Block.png">草方塊 x25</div>
        <div class="material-item"><img src="https://zh.minecraft.wiki/images/thumb/Dirt.png/64px-Dirt.png">土塊 x10</div>`;
        const matList = document.getElementById('materials-list');
        matList.innerHTML = materialsHTML;
        setTimeout(() => {
          document.querySelectorAll('.material-item').forEach((el, i) => setTimeout(() => el.classList.add('show'), i * 300));
        }, 800);

        // 步驟動畫
        const stepsHTML = `<div class="step">1. 準備草方塊</div><div class="step">2. 放置土塊</div>`;
        const stepList = document.getElementById('steps-list');
        stepList.innerHTML = stepsHTML;
        setTimeout(() => {
          document.querySelectorAll('.step').forEach((el, i) => setTimeout(() => el.classList.add('show'), i * 400));
        }, 1200);

        document.getElementById('star-modal').classList.add('show');
      })
      .catch(err => alert('API 呼叫失敗，請檢查 Key'));
    }

    function openGithub() { window.open('https://github.com/illusd/br-mine-build', '_blank'); }
    function closeModal() { document.getElementById('star-modal').classList.remove('show'); }
  </script>
</body>
</html>
